version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: smartspend_postgres
    restart: always
    environment:
      POSTGRES_USER: smartuser
      POSTGRES_PASSWORD: smartpassword
      POSTGRES_DB: smartspend_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartuser -d smartspend_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: smartspend_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://smartuser:smartpassword@postgres_db:5432/smartspend_db
      - SECRET_KEY=SUPER_SECRET_SECURITY_PASSPORT_TOKEN_KEY
    depends_on:
      postgres_db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: smartspend_frontend
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - backend

volumes:
  postgres_data:
